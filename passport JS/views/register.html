<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>

<body>

    <h1>Register</h1>

    <form action="/auth/register" method="POST">

        <label>Username:</label>
        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >

        <br><br>

        <label>Password:</label>
        <input
            type="password"
            name="password"
            placeholder="password"
            required
        >

        <br><br>

        <button type="submit">
            Register
        </button>

    </form>

    <br>

    <a href="/login.html">
        Already have an account? Login
    </a>

</body>
</html>
